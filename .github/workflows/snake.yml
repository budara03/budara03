name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest

    steps:
      - name: Generate Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: budara03

          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-light&color_snake=4B3621&color_dots=F5E6D3,CDB885,A77F60,8B5E3C,4B3621

      - name: Publish Snake
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: output
          folder: dist
          clean: true
