name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: budara03
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-light&color_snake=8B5E3C&color_dots=F5E6D3,CDB885,A77F60,8B5E3C,4B3621

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
